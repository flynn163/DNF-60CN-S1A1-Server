name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: 'true'
  CMAKE_GENERATOR: Visual Studio 17 2022

jobs:
  validate:
    name: Validate (${{ matrix.configuration }})
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Prepare logs
        run: New-Item -ItemType Directory -Path artifacts/ci/logs -Force | Out-Null
      - name: Run managed fixtures without native bridge
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          dotnet run --project tests/DFLegacy.SmokeTests/DFLegacy.SmokeTests.csproj -c $env:CONFIGURATION -p:BuildRandomNativeReference=false -- --fixtures-only 2>&1 |
            Tee-Object -FilePath artifacts/ci/logs/managed-fallback.log
          if ($LASTEXITCODE -ne 0) { throw 'Managed fallback checks failed.' }
      - name: Build and test x64 random bridge
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: ./src/DFLegacy.RandomNative/build-native.ps1 -Configuration $env:CONFIGURATION -RunTests
      - name: Run managed fixtures with native bridge
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          dotnet run --project tests/DFLegacy.SmokeTests/DFLegacy.SmokeTests.csproj -c $env:CONFIGURATION -p:BuildRandomNativeReference=false -- --fixtures-only 2>&1 |
            Tee-Object -FilePath artifacts/ci/logs/managed-native.log
          if ($LASTEXITCODE -ne 0) { throw 'Managed native-bridge checks failed.' }
          if (-not (Test-Path "tests/DFLegacy.SmokeTests/bin/$env:CONFIGURATION/net10.0/DFLegacy.RandomNative.dll")) {
            throw 'Native bridge was not copied to the managed test output.'
          }
      - name: Build and test x86 compatibility module
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: ./src/DFLegacy.Ijl15/build-native.ps1 -Configuration $env:CONFIGURATION -RunTests
      - name: Build launcher
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: dotnet build src/DFLegacy.Launcher/DFLegacy.Launcher.csproj -c $env:CONFIGURATION
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-logs-${{ matrix.configuration }}
          path: |
            artifacts/ci/logs/*.log
            artifacts/native/**/Testing/Temporary/*.log
            artifacts/native/**/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 7

  package:
    name: Package (Windows x64)
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Build native modules
        run: |
          ./src/DFLegacy.RandomNative/build-native.ps1 -Configuration Release
          ./src/DFLegacy.Ijl15/build-native.ps1 -Configuration Release
      - name: Create self-contained test package
        run: ./.github/scripts/package.ps1
      - name: Upload Windows test package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-${{ github.sha }}
          path: |
            artifacts/ci/package/*.zip
            artifacts/ci/package/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packaging-logs
          path: artifacts/native/**/Testing/Temporary/*.log
          if-no-files-found: ignore
          retention-days: 7
